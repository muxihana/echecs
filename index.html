      function canRequestHint() {
        return isComputerMode() && coachEnabled && engineReady && !engineThinking && !hintThinking &&
          activeCoachController === null && !engineFailed && !game.game_over() && game.turn() === "w";
      }

      function renderCoach() {
        const computerMode = isComputerMode();
        coachStage.classList.toggle("two-player", !computerMode);
        coachToggle.hidden = !computerMode;   // 開關住到標題列了（08-28 業主版型），跟回合牌當鄰居
        coachToggle.setAttribute("aria-checked", String(coachEnabled));
        coachToggle.textContent = "教練";   // 開關狀態用顏色講（暗＝關），字面不囉嗦（業主 08-28）
        helpButton.disabled = !canRequestHint();
        helpButton.textContent = hintThinking ? "找路中" : "求救";
        chatForm.hidden = !computerMode || !coachEnabled;
        chatInput.disabled = chatSending || hintThinking || activeCoachController !== null;
        chatSendButton.disabled = chatSending || hintThinking || activeCoachController !== null;
        himBubbleStack.replaceChildren();
        herBubbleStack.replaceChildren();

        coachStage.classList.toggle("coach-off", !coachEnabled);
        // 泡泡政策（業主 09-02 實玩點單）：保留 8 秒內最近 3 句，常態兩邊各留最後一句
        let visibleEntries = [];
        const talk = coachTranscript.filter((e) => e.who !== "sys");   // sys=時間軸事件，不上泡泡
        if (coachEnabled && talk.length) {
          const now = performance.now();
          const recent = talk.slice(-3).filter((e) => now - (e.shownAt || 0) < 8000);
          const lastHer = talk.filter((e) => e.who === "her").at(-1);
          const lastHim = talk.filter((e) => e.who === "him").at(-1);
          const visibleSet = new Set([...recent, lastHer, lastHim].filter(Boolean));
          visibleEntries = talk.filter((e) => visibleSet.has(e));
          if (recent.length) {   /* 只有熱鬧期泡泡需要到點收攏；常態雙留不必無限重排 */
            clearTimeout(renderCoach._fadeTimer);
            renderCoach._fadeTimer = setTimeout(renderCoach, 8200);
          }
        }
        for (const entry of visibleEntries) {
          const bubble = document.createElement("div");
          bubble.className = "coach-bubble " + entry.who + (entry._animated ? "" : " pop");
          entry._animated = true;
          bubble.textContent = entry.text;
          (entry.who === "her" ? herBubbleStack : himBubbleStack).append(bubble);
        }

        if (coachThinking && computerMode && coachEnabled) {
          const thinking = document.createElement("div");
          thinking.className = "coach-thinking";
          thinking.setAttribute("aria-label", "對面在想話");
          const dots = document.createElement("span");
          dots.className = "thinking-dots";
          dots.setAttribute("aria-label", "…");
          dots.innerHTML = "<i></i><i></i><i></i>";
          thinking.append(dots);
          himBubbleStack.append(thinking);
        }
      }

      // 將軍可視化（2026-08-28 業主：「被將軍還不知道哪裡將軍」）：找出攻擊源與攻擊路線
      function findCheckSquares() {
        if (!game.in_check()) return null;
        const defender = game.turn();
        const files = "abcdefgh";
        let kingSquare = null;
        const enemies = [];
        for (let r = 1; r <= 8; r += 1) {
          for (let f = 0; f < 8; f += 1) {
            const sq = files[f] + r;
            const p = game.get(sq);
            if (!p) continue;
            if (p.color === defender && p.type === "k") kingSquare = sq;
            else if (p.color !== defender) enemies.push({ sq, p, f, r });
          }
        }
        if (!kingSquare) return null;
        const kf = files.indexOf(kingSquare[0]), kr = Number(kingSquare[1]);
        const sources = [], path = [];
        const clearRay = (f0, r0, df, dr) => {
          const cells = [];
          let f = f0 + df, r = r0 + dr;
          while (f !== kf || r !== kr) {
            if (f < 0 || f > 7 || r < 1 || r > 8) return null;
            if (game.get(files[f] + r)) return null;
            cells.push(files[f] + r);
            f += df; r += dr;
          }
          return cells;
        };
        for (const e of enemies) {
          const df = Math.sign(kf - e.f), dr = Math.sign(kr - e.r);
          const adf = Math.abs(kf - e.f), adr = Math.abs(kr - e.r);
          let hit = null;
          if (e.p.type === "n") { if ((adf === 1 && adr === 2) || (adf === 2 && adr === 1)) hit = []; }
          else if (e.p.type === "p") { if (adr === 1 && adf === 1 && ((e.p.color === "w" && kr === e.r + 1) || (e.p.color === "b" && kr === e.r - 1))) hit = []; }
          else if (e.p.type === "k") { if (adf <= 1 && adr <= 1) hit = []; }
          else {
            const straight = adf === 0 || adr === 0, diag = adf === adr;
            if ((e.p.type === "r" && straight) || (e.p.type === "b" && diag) || (e.p.type === "q" && (straight || diag))) {
              hit = clearRay(e.f, e.r, df, dr);
            }
          }
          if (hit) { sources.push(e.sq); path.push(...hit); }
        }
        return sources.length ? { king: kingSquare, sources, path } : null;
      }

      function renderBoard() {
        const position = game.board();
        const boardLocked = isBoardLocked();
        const checkInfo = findCheckSquares();
        boardElement.replaceChildren();
        boardElement.classList.toggle("locked", boardLocked);
        boardElement.setAttribute("aria-busy", String(engineThinking));

        for (let row = 0; row < 8; row += 1) {
          const rank = 8 - row;
          for (let fileIndex = 0; fileIndex < 8; fileIndex += 1) {
            const square = squareName(fileIndex, rank);
            const piece = position[row][fileIndex];
            const legalMove = legalMoves.find(move => move.to === square);
            const button = document.createElement("button");
            button.type = "button";
            button.className = "square" + ((row + fileIndex) % 2 ? " dark" : "");
            button.dataset.square = square;
            button.setAttribute("role", "gridcell");
            button.disabled = boardLocked;

            if (piece) {
              const pieceElement = document.createElement("span");
              pieceElement.className = "piece " + (piece.color === "w" ? "white" : "black");
              pieceElement.textContent = PIECES[piece.color][piece.type];
              pieceElement.setAttribute("aria-hidden", "true");
              button.append(pieceElement);
              button.setAttribute("aria-label", square + "，" + sideName(piece.color) + PIECE_NAMES[piece.type]);
              if (piece.color === game.turn() && !game.game_over() && !boardLocked) button.classList.add("selectable");
            } else {
              button.setAttribute("aria-label", square + "，空格");
            }

            if (checkInfo) {
              if (square === checkInfo.king) button.classList.add("check-king");
              if (checkInfo.sources.includes(square)) button.classList.add("check-source");
              if (checkInfo.path.includes(square)) button.classList.add("check-path");
            }
            if (square === selectedSquare) button.classList.add("selected");
            if (legalMove) {
              button.classList.add("legal");
              if (legalMove.captured) button.classList.add("capture");
              button.setAttribute("aria-label", button.getAttribute("aria-label") + "，合法落點");
            }

            if (rank === 1) {
              const fileLabel = document.createElement("span");
              fileLabel.className = "coord file";
              fileLabel.textContent = FILES[fileIndex];
              fileLabel.setAttribute("aria-hidden", "true");
              button.append(fileLabel);
            }
            if (fileIndex === 0) {
              const rankLabel = document.createElement("span");
              rankLabel.className = "coord rank";
              rankLabel.textContent = rank;
              rankLabel.setAttribute("aria-hidden", "true");
              button.append(rankLabel);
            }

            boardElement.append(button);
          }
        }
      }

      function render() {
        renderBoard();
        updateStatus();
        updateHistory();
        renderCoach();
      }

      function clearSelection() {
        selectedSquare = null;
        legalMoves = [];
      }

      function clearEngineTimer() {
        if (engineTimer !== null) {
          window.clearTimeout(engineTimer);
          engineTimer = null;
        }
      }

      function cancelCoachRequest() {
        if (activeCoachController) activeCoachController.abort();
        activeCoachController = null;
        coachThinking = false;
      }

      function sendEngineCommand(command) {
        if (!engine) return;
        engineCommandLog.push({ command, at: performance.now() });
        console.info("[Stockfish UCI] " + command);
        engine.postMessage(command);
      }

      function stopEngine() {
        engineGeneration += 1;
        clearEngineTimer();
        cancelCoachRequest();
        if (engine) engine.terminate();
        engine = null;
        engineReady = false;
        engineThinking = false;
        hintThinking = false;
        lastSearchEvalW = null;
      }

      function failEngine() {
        engineGeneration += 1;
        clearEngineTimer();
        cancelCoachRequest();
        if (engine) engine.terminate();
        engine = null;
        engineReady = false;
        engineThinking = false;
        hintThinking = false;
        engineFailed = true;
        clearSelection();
        render();
      }

      function parseEvalW(message) {
        const score = /\bscore\s+(cp|mate)\s+(-?\d+)/.exec(message);
        if (!score) return null;
        const value = Number(score[2]);
        if (!Number.isFinite(value)) return null;
        if (score[1] === "cp") return -value;
        if (value > 0) return -10000;
        if (value < 0) return 10000;
        return 0;
      }

      function getGameResult(targetGame) {
        if (!targetGame.game_over()) return undefined;
        if (!targetGame.in_checkmate()) return "draw";
        return targetGame.turn() === "w" ? "engine" : "player";
      }

      function makeBlunderSummary(drop, captured) {
        const pawns = Math.max(2, Math.round(drop / 10) / 10);
        let summary = "這步之後局面掉了約" + pawns.toFixed(pawns % 1 === 0 ? 0 : 1) + "個兵的價值";
        if (captured && captured !== "p" && captured !== "k") summary += "，等於送了" + PIECE_NAMES[captured];
        return summary;
      }

      // ---------- 盤況翻譯官（2026-09-02，牌桌腦暴帳§五）----------
      // 「會看錯位置」＝嘴自己讀棋譜代號腦補座標的病。修法＝程式讀盤翻成中文事實清單餵嘴，
      // 嘴只評論已解讀的事實。純函式零模型成本；攻擊判定自算（chess.js 0.13.4 沒開 attackers API）。

      function attackersOf(targetGame, square, byColor) {
        const board = targetGame.board();
        const file = FILES.indexOf(square[0]);
        const rank = Number(square[1]);
        const at = (f, r) => (f < 0 || f > 7 || r < 1 || r > 8) ? null : board[8 - r][f];
        const found = [];
        const collect = (f, r, types) => {
          const piece = at(f, r);
          if (piece && piece.color === byColor && types.includes(piece.type)) found.push(piece.type);
        };
        const pawnRank = byColor === "w" ? rank - 1 : rank + 1;   /* 兵斜吃：白往上、黑往下 */
        collect(file - 1, pawnRank, ["p"]);
        collect(file + 1, pawnRank, ["p"]);
        for (const [df, dr] of [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]]) collect(file + df, rank + dr, ["n"]);
        for (let df = -1; df <= 1; df += 1) for (let dr = -1; dr <= 1; dr += 1) {
          if (df || dr) collect(file + df, rank + dr, ["k"]);
        }
        for (const [df, dr, types] of [[1, 0, ["r", "q"]], [-1, 0, ["r", "q"]], [0, 1, ["r", "q"]], [0, -1, ["r", "q"]],
                                       [1, 1, ["b", "q"]], [1, -1, ["b", "q"]], [-1, 1, ["b", "q"]], [-1, -1, ["b", "q"]]]) {
          let f = file + df;
          let r = rank + dr;
          while (f >= 0 && f <= 7 && r >= 1 && r <= 8) {
            const piece = at(f, r);
            if (piece) {
              if (piece.color === byColor && types.includes(piece.type)) found.push(piece.type);
              break;
            }
            f += df;
            r += dr;
          }
        }
        return found;
      }

      function sideWord(color) {
        return color === "w" ? "玩家" : "你";
      }

      function moveFact(verboseMove, mover, opponent) {
        if (!verboseMove) return "";
        const name = COACH_PIECE_NAMES[verboseMove.piece];
        let fact;
        if (verboseMove.flags.includes("k")) fact = mover + "短易位（國王移到 " + verboseMove.to + "）";
        else if (verboseMove.flags.includes("q")) fact = mover + "長易位（國王移到 " + verboseMove.to + "）";
        else if (verboseMove.captured) fact = mover + "用 " + verboseMove.from + " 的" + name + "吃掉" + opponent + " " + verboseMove.to + " 的" + COACH_PIECE_NAMES[verboseMove.captured] + (verboseMove.flags.includes("e") ? "（吃過路兵）" : "");
        else fact = mover + "把 " + verboseMove.from + " 的" + name + "走到 " + verboseMove.to;
        if (verboseMove.promotion) fact += "，升變成" + COACH_PIECE_NAMES[verboseMove.promotion];
        if (verboseMove.san.endsWith("#")) fact += "，將死";
        else if (verboseMove.san.endsWith("+")) fact += "，將軍";
        return fact;
      }

      function evalFact(evalW) {
        if (typeof evalW !== "number") return "";
        if (evalW <= -9000) return "引擎判定：你（執黑）勝勢，已看到將死路線";
        if (evalW >= 9000) return "引擎判定：玩家（執白）勝勢，已看到將死路線";
        const pawns = Math.abs(evalW) / 100;
        if (pawns < 0.6) return "引擎判定：局面大致均勢";
        const grade = pawns < 1.5 ? "稍佔上風" : pawns < 3 ? "明顯佔優" : "大幅領先";
        return "引擎判定：" + (evalW > 0 ? "玩家" : "你") + grade + "（約 " + pawns.toFixed(1) + " 個兵的價值）";
      }

      function materialFact(targetGame) {
        let diff = 0;
        for (const row of targetGame.board()) for (const piece of row) {
          if (piece) diff += (piece.color === "w" ? 1 : -1) * PIECE_VALUES[piece.type];
        }
        if (diff === 0) return "子力：雙方相當";
        return "子力：" + (diff > 0 ? "玩家" : "你") + "多了約 " + Math.abs(diff) + " 個兵的價值";
      }

      function threatFacts(targetGame) {
        const facts = [];
        const board = targetGame.board();
        for (const color of ["w", "b"]) {
          const foe = color === "w" ? "b" : "w";
          const threatened = [];
          for (let rowIndex = 0; rowIndex < 8; rowIndex += 1) for (let fileIndex = 0; fileIndex < 8; fileIndex += 1) {
            const piece = board[rowIndex][fileIndex];
            if (!piece || piece.color !== color || piece.type === "k") continue;
            const square = FILES[fileIndex] + (8 - rowIndex);
            const attackers = attackersOf(targetGame, square, foe);
            if (!attackers.length) continue;
            const defenders = attackersOf(targetGame, square, color);
            const cheapest = Math.min(...attackers.map(type => type === "k" ? 99 : PIECE_VALUES[type]));   /* 王吃有保護的子＝送王，不算贏吃 */
            if (!defenders.length) threatened.push({ square, type: piece.type, value: PIECE_VALUES[piece.type], why: "沒有子保護" });
            else if (cheapest < PIECE_VALUES[piece.type]) threatened.push({ square, type: piece.type, value: PIECE_VALUES[piece.type], why: "被更小的子瞄著（換過去會虧）" });
          }
          threatened.sort((a, b) => b.value - a.value);
          for (const threat of threatened.slice(0, 2)) {
            facts.push("威脅：" + sideWord(color) + " " + threat.square + " 的" + COACH_PIECE_NAMES[threat.type] + "正被" + sideWord(foe) + "攻擊，" + threat.why);
          }
        }
        return facts;
      }

      function zoneWord(square) {
        return Number(square[1]) <= 4 ? "在白方這半邊（玩家的半場）" : "在黑方這半邊（你的半場）";
      }

      function landingFact(targetGame, verboseMove, mover, opponent) {
        if (!verboseMove) return "";
        const piece = targetGame.get(verboseMove.to);
        if (!piece || piece.color !== verboseMove.color) return "";
        const foe = verboseMove.color === "w" ? "b" : "w";
        const attackers = attackersOf(targetGame, verboseMove.to, foe);
        const defenders = attackersOf(targetGame, verboseMove.to, verboseMove.color);
        const attackText = attackers.length ? "正被" + opponent + "的" + attackers.map(type => COACH_PIECE_NAMES[type]).join("、") + "攻擊" : "沒有被任何子攻擊";
        const defendText = defenders.length ? "有 " + defenders.length + " 顆子保護" : "沒有子保護";
        return mover + "剛走到 " + verboseMove.to + " 的" + COACH_PIECE_NAMES[piece.type] + "：" + zoneWord(verboseMove.to) + "，" + attackText + "，" + defendText;
      }

      function boardFacts(targetGame, evalW) {
        const facts = [materialFact(targetGame)];
        const evalLine = evalFact(evalW);
        if (evalLine) facts.push(evalLine);
        if (targetGame.in_checkmate()) facts.push("現在" + sideWord(targetGame.turn()) + "被將死，對局結束");
        else if (targetGame.in_check()) facts.push("現在" + sideWord(targetGame.turn()) + "的國王正被將軍");
        const verbose = targetGame.history({ verbose: true });
        const playerLanding = landingFact(targetGame, verbose.filter((_m, i) => i % 2 === 0).at(-1), "玩家", "你");
        const hisLanding = landingFact(targetGame, verbose.filter((_m, i) => i % 2 === 1).at(-1), "你", "玩家");
        if (playerLanding) facts.push(playerLanding);
        if (hisLanding) facts.push(hisLanding);
        facts.push(...threatFacts(targetGame));
        return facts;
      }

      function lastRecordedEvalW() {
        return evalHistory.length ? evalHistory.at(-1).evalW : null;
      }

      function payloadFor(trigger, details) {
        const payload = {
          trigger,
          moveNo: details.moveNo,
          lastSan: details.lastSan || "",
          engineSan: details.engineSan || "",
          difficulty: DIFFICULTIES[activeDifficulty].label,
          summary: details.summary,
          transcript: coachTranscript.filter(entry => entry.who !== "sys").slice(-12).map(entry => ({ who: entry.who, text: entry.text }))
        };
        if (typeof details.text === "string") payload.text = details.text;
        if (typeof details.bestSan === "string") payload.bestSan = details.bestSan;
        if (Array.isArray(details.facts) && details.facts.length) payload.facts = details.facts.slice(0, 10);
        if (details.lastFact) payload.lastFact = details.lastFact;
        if (details.engineFact) payload.engineFact = details.engineFact;
        if (details.bestFact) payload.bestFact = details.bestFact;
        if (Number.isInteger(details.askCount)) payload.askCount = details.askCount;
        if (details.result) payload.result = details.result;
        if (details.pgn !== undefined) payload.pgn = details.pgn;
        if (details.blunders !== undefined) payload.blunders = details.blunders;
        return payload;
      }

      function factsBlock(b) {
        if (!Array.isArray(b.facts) || !b.facts.length) return "";
        return "\n【盤況翻譯官小抄（程式讀盤翻好的事實，講局面以這份為準；禁自己憑棋譜代號腦補位置，禁逐條複誦；小抄沒列的威脅＝不存在，禁自己腦補「孤伶伶」「被盯著」「在誰的半場」——半場與攻防都在小抄裡）】\n- " + b.facts.slice(0,8).map(value => String(value).slice(0,120)).join("\n- ");
      }

      function pieceName(san) {
        if (!san) return "";
        return ({ K: "國王", Q: "皇后", R: "城堡", B: "主教", N: "騎士" })[san[0]] || "小兵";
      }

      function buildTrigger(trigger,extra = {}) {
        const b = payloadFor(trigger,extra);
        const mv = b.lastSan ? "第 " + b.moveNo + " 手玩家走了 " + b.lastSan + (b.lastFact ? "＝" + b.lastFact : "（動的是" + pieceName(b.lastSan) + "）") : "";
        const reply = b.engineFact ? "你回手 " + (b.engineSan || "") + "＝" + b.engineFact + "；" : "";
        if (trigger === "opening") return "【棋桌時機】玩家剛坐下來開了新的一局（電腦難度：" + (b.difficulty || "入門") + "，玩家執白先走）。跟玩家開場說句話。";
        if (trigger === "good") return "【棋桌時機】" + mv + "，這步走得穩、沒虧（" + reply + "局勢：" + (b.summary || "大致均勢") + "）。誇玩家一句，順口點出這步好在哪（白話）。" + factsBlock(b);
        if (trigger === "blunder") return "【棋桌時機】" + mv + "，這步虧大了——" + (b.summary || "送了子力或漏看威脅") + "（" + reply + "小抄裡有玩家漏看的威脅）。用你的方式讓玩家知道走壞了、問題出在哪；可以提一句想反悔就按悔棋。" + factsBlock(b);
        if (trigger === "check-her") return "【棋桌時機】" + mv + "之後，" + reply + "玩家被將軍了。提醒玩家現在必須先救國王。" + factsBlock(b);
        if (trigger === "check-you") return "【棋桌時機】" + mv + "，玩家將軍了你。回應這件事。" + factsBlock(b);
        if (trigger === "gameover") {
          const result = b.result === "player" ? "玩家贏了" : b.result === "engine" ? "玩家輸了（你這邊的電腦贏了）" : "和局";
          return "【棋桌時機】這局結束：" + result + (b.lastFact ? "——最後一手：" + b.lastFact : "") + "。回應這個結果，一兩句。" + factsBlock(b);
        }
        if (trigger === "postgame") {
          const winnerLine = b.result === "player" ? "玩家贏、你輸——最後那步將死是玩家走的" : b.result === "engine" ? "你贏、玩家輸——最後那步將死是你走的" : "和局";
          const parts = ["【賽後講評（放寬到至多五句）】這局打完了（結果：" + winnerLine + "；共 " + (b.moveNo || "?") + " 手）。"];
          if (b.pgn) {
            const tokens = String(b.pgn).trim().split(/\s+/).filter(Boolean);
            parts.push("棋譜（每手已標註是誰走的，以括號為準）：" + tokens.map((token,index) => token + "(" + (index % 2 === 0 ? "玩家" : "你") + ")").join(" "));
          }
          if (Array.isArray(b.blunders) && b.blunders.length) parts.push("玩家這局的虧手：" + b.blunders.map(item => "第" + item.moveNo + "手 " + item.san + "（" + (item.summary || "虧") + "）").join("、"));
          else parts.push("這局玩家沒有明顯虧手。");
          const past = readJson(GAMES_KEY,[]).slice(-3).map(row => String(row?.comment || "").trim()).filter(Boolean);
          if (past.length) parts.push("【你之前幾局對玩家的講評（找找玩家有沒有重複犯的毛病，有就點出來；沒有就別硬掰）】\n" + past.join("\n---\n"));
          parts.push("給玩家一段賽後講評：這局最值得記住的一件事（好的或壞的挑最重要的講）、如果有反覆犯的毛病點出來、最後留一句下局的期待。\n主詞校對（最高優先）：勝負與每一手的歸屬以【結果】行和棋譜括號為準——玩家輸的局禁寫成玩家將死你、你的手禁記到玩家頭上；你／玩家用反＝整段作廢。");
          return parts.join("\n");
        }
        if (trigger === "hint") {
          const best = b.bestFact ? b.bestFact + "（棋譜記法 " + (b.bestSan || "?") + "）" : (b.bestSan || "（引擎沒給）");
          const base = "【求救】玩家按了求救鈕（第 " + b.moveNo + " 手，輪玩家走）。引擎認為此刻最好的一步是 " + best + "。";
          if ((b.askCount || 1) >= 2) return base + "這是玩家這一手第二次求救了——直接告訴玩家怎麼走（白話講清楚哪顆子走去哪、為什麼），順口虧一句。" + factsBlock(b);
          return base + "第一次求救別直接報答案：用一兩句把玩家的眼睛引去對的地方——點名該注意的那顆子或那個威脅、為什麼重要，讓玩家自己找到那步。" + factsBlock(b);
        }
        if (trigger === "chat") return "【棋桌閒聊】玩家邊下棋邊跟你說：" + JSON.stringify(String(b.text || "").slice(0,500)) + "（局面：第 " + b.moveNo + " 手，輪玩家走" + (b.lastSan ? "；玩家上一手：" + (b.lastFact || "走的是 " + b.lastSan) : "") + (b.engineSan ? "、你上一手：" + (b.engineFact || "回的是 " + b.engineSan) + "——別把你自己的棋算到玩家頭上" : "") + "）。回玩家的話——可以聊、可以順便講棋，但別自顧自上課。" + factsBlock(b);
        return "【棋桌時機】" + mv + "。順著局面說句話。" + factsBlock(b);
      }

      function buildMessages(trigger,details = {}) {
        const player = settings.playerName.trim() || "你";
        const skillLine = settings.playerSkill === "experienced" ? "玩家會下棋；你只陪下不上課，講評照樣講，但別教規則" : "玩家是初學者；你會教，教的時候白話具體、一次只講一件事";
        const scene = "【角色卡】\n角色名：" + settings.characterName.trim() + "\n" + (settings.characterDescription.trim() || "（角色卡沒有補充描述）") + "\n\n【棋桌場景】\n你是" + settings.characterName.trim() + "，正在跟" + player + "面對面下西洋棋，玩家執白、你執黑（你的棋由引擎代走，你負責看盤開口）。" + skillLine + "。棋子一律用中文講（國王、皇后、城堡、騎士、主教、小兵），格子代號偶爾點到可以，禁連發堆砌。相處模式只依角色卡，不自行預設關係。\n\n【輸出規則（最高優先）】\n- 你是角色本人，正在棋桌對面開口。輸出只有台詞本文，零其他。\n- 至多兩句（賽後講評放寬到至多五句）。一句能講完就一句。\n- 禁 markdown、表情符號、顏文字、引號包台詞、動作描寫與旁白。\n- 局面資訊是小抄：禁報評分數字、禁逐字複誦小抄。\n- 同一個梗不要重複。";
        const messages = [{ role: "system", content: scene }];
        for (const row of chatHistory.filter(entry => entry.who === "him").slice(-12)) messages.push({ role: "assistant", content: row.text });
        messages.push({ role: "user", content: buildTrigger(trigger,details) });
        return messages;
      }

      function postprocess(text,maxLines) {
        const out = [];
        for (let line of String(text || "").split("\n")) {
          line = line.trim().replace(/^[-*>•]\s*/,"").replace(/^[「\"'“”]|[」\"'“”]$/g,"");
          if (line) out.push(line);
        }
        return out.slice(0,maxLines);
      }

      async function askCoach(trigger, details) {
        if (!isComputerMode() || !coachEnabled || !settingsComplete()) return false;
        const payload = payloadFor(trigger, details);
        const messages = buildMessages(trigger,details);
        const controller = new AbortController();
        const logEntry = {
          trigger,
          moveNo: details.moveNo,
          request: JSON.parse(JSON.stringify(payload)),
          url: endpointPath("/chat/completions"),
          messages: JSON.parse(JSON.stringify(messages)),
          startedAt: performance.now(),
          ok: false,
          lines: 0
        };
        coachRequestLog.push(logEntry);
        activeCoachController = controller;
        coachThinking = true;
        renderCoach();
        const timeout = window.setTimeout(() => controller.abort(), COACH_TIMEOUT_MS);

        try {
          const response = await fetch(logEntry.url, {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + settings.apiKey.trim() },
            body: JSON.stringify({ model: settings.model.trim(), messages, stream: false, max_tokens: trigger === "postgame" ? 700 : 400 }),
            signal: controller.signal
          });
          if (!response.ok) return false;
          const data = await response.json();
          const lines = postprocess(data?.choices?.[0]?.message?.content,trigger === "postgame" ? 6 : 2);
          if (lines.length === 0) return false;
          const shownAt = performance.now();
          coachThinking = false;
          for (let index = 0; index < lines.length; index += 1) {
            const text = lines[index];
            coachTranscript.push({ who: "him", text, moveNo: details.moveNo, trigger, shownAt });
            chatHistory.push({ who: "him", text, d: localDay() });
            chatHistory = chatHistory.slice(-CHAT_CAP);
            saveChat();
            saveGame();
            renderCoach();
            if (index < lines.length - 1) {
              await new Promise(resolve => window.setTimeout(resolve, 220));
            }
          }
          if (trigger !== "hint" && trigger !== "chat") lastCoachMove = details.moveNo;
          logEntry.ok = true;
          logEntry.lines = lines.length;
          logEntry.shownAt = shownAt;
          return true;
        } catch (_error) {
          return false;
        } finally {
          window.clearTimeout(timeout);
          logEntry.endedAt = performance.now();
          if (activeCoachController === controller) activeCoachController = null;
          coachThinking = false;
          renderCoach();
        }
      }

      function postgameDetails() {
        const history = game.history();
        const whiteMoves = history.filter((_san, index) => index % 2 === 0);
        return {
          moveNo: whiteMoves.length,
          lastSan: whiteMoves.at(-1) || "",
          summary: "這局已經結束，可以回頭看關鍵得失",
          result: getGameResult(game),
          pgn: history.join(" "),
          blunders: evalHistory.filter(entry => entry.drop >= 200).map(entry => ({
            moveNo: entry.moveNo,
            san: entry.san,
            summary: entry.summary || makeBlunderSummary(entry.drop)
          }))
        };
      }

      async function requestPostgame() {
        if (postgameRequested || !isComputerMode() || !game.game_over()) return;
        postgameRequested = true;
        const details = postgameDetails();
        const before = coachTranscript.length;
        const ok = await askCoach("postgame", details);
        if (!ok) return;
        const comment = coachTranscript.slice(before).filter(entry => entry.who === "him" && entry.trigger === "postgame").map(entry => entry.text).join("\n");
        const games = readJson(GAMES_KEY,[]);
        games.push({ ts: Date.now(), result: details.result, moves: details.moveNo, pgn: details.pgn, blunders: details.blunders, comment });
        safeSet(GAMES_KEY,JSON.stringify(games.slice(-30)));
        const key = details.result === "player" ? "player" : details.result === "engine" ? "character" : "draw";
        records[key] += 1;
        safeSet(RECORD_KEY,JSON.stringify(records));
      }

      async function handleHumanGameOver(lastSan) {
        if (!isComputerMode() || !game.game_over()) return;
        const history = game.history();
        const verboseHistory = game.history({ verbose: true });
        const details = {
          moveNo: Math.ceil(history.length / 2),
          lastSan,
          lastFact: moveFact(verboseHistory.at(-1), "玩家", "你"),
          facts: boardFacts(game, null),
          summary: "玩家這步讓對局直接進入終局",
          result: getGameResult(game)
        };
        await askCoach("gameover", details);
        await requestPostgame();
      }

      function analyzeEngineReply(uciMove, evalW) {
        const match = /^([a-h][1-8])([a-h][1-8])([qrbn])?$/.exec(uciMove);
        if (!match) return null;
        const history = game.history();
        const simulated = replayMoves(history);
        if (!simulated) return null;
        const engineMove = simulated.move({ from: match[1], to: match[2], promotion: match[3] || "q" });
        if (!engineMove) return null;

        const moveNo = Math.ceil(history.length / 2);
        const lastSan = history.at(-1) || "";
        evalHistory = evalHistory.filter(entry => entry.moveNo < moveNo);
        const prevEvalW = evalHistory.length ? evalHistory.at(-1).evalW : 0;
        const drop = evalW === null ? null : prevEvalW - evalW;
        const blunderSummary = drop !== null && drop >= 200 ? makeBlunderSummary(drop, engineMove.captured) : "";
        if (evalW !== null) {
          evalHistory.push({ moveNo, san: lastSan, evalW, prevEvalW, drop, summary: blunderSummary });
          saveGame();
        }

        const distance = lastCoachMove === null ? Infinity : moveNo - lastCoachMove;
        const alreadyOpened = coachTranscript.some(entry => entry.trigger === "opening");   /* 開場白已提前到開桌，這裡只防重複 */
        let trigger = null;
        let summary = "局面繼續發展";
        let result;

        if (simulated.game_over()) {
          trigger = "gameover";
          summary = "對手這步讓對局進入終局";
          result = getGameResult(simulated);
        } else if (moveNo === 1 && !alreadyOpened) {
          trigger = "opening";
          summary = "玩家走出第一步，局面剛展開";
        } else if (simulated.in_check() && distance >= 2) {
          trigger = "check-her";
          summary = "對手回手將軍，玩家的王正受攻擊";
        } else if (drop !== null && drop >= 200 && distance >= 2) {
          trigger = "blunder";
          summary = blunderSummary;
        } else if (game.in_check() && distance >= 2) {
          trigger = "check-you";
          summary = "玩家這步將軍，對手的王正受攻擊";
        } else if (drop !== null && drop <= 30 && moveNo >= 6 && distance >= 8) {
          trigger = "good";
          summary = "局面穩住";
        }
        // 盤況翻譯官：事實清單對準 simulated（含引擎回手）——他本來就是先出話再落子，話講的是他出完手的局面
        const verboseHistory = simulated.history({ verbose: true });
        return {
          match, moveNo, lastSan, trigger, summary, result,
          lastFact: moveFact(verboseHistory.at(-2), "玩家", "你"),
          engineFact: moveFact(verboseHistory.at(-1), "你", "玩家"),
          facts: boardFacts(simulated, evalW)
        };
      }

      function applyEngineMove(uciMove, elapsedMs, evalW) {
        const match = /^([a-h][1-8])([a-h][1-8])(?:[qrbn])?$/.exec(uciMove);
        if (!match) {
          failEngine();
          return;
        }

        const move = game.move({ from: match[1], to: match[2], promotion: "q" });
        if (!move) {
          failEngine();
          return;
        }

        clearEngineTimer();
        engineThinking = false;
        lastEngineReply = Object.freeze({ uci: uciMove, san: move.san, elapsedMs, evalW, appliedAt: performance.now() });
        const sysMove = [...coachTranscript].reverse().find(e => e.who === "sys" && e.kind === "move");
        if (sysMove && !sysMove.text.includes("　他 ")) sysMove.text += "　他 " + move.san;
        clearSelection();
        saveGame();
        render();
        if (game.game_over()) void requestPostgame();
      }

      async function resolveEngineMove(uciMove, evalW, generation, elapsedMs) {
        const analysis = analyzeEngineReply(uciMove, evalW);
        if (!analysis) {
          failEngine();
          return;
        }
        let showedLines = false;
        if (analysis.trigger) showedLines = await askCoach(analysis.trigger, analysis);
        if (generation !== engineGeneration || !engineThinking) return;
        if (showedLines) await new Promise(resolve => window.setTimeout(resolve, ENGINE_MOVE_DELAY_MS));
        if (generation !== engineGeneration || !engineThinking) return;
        applyEngineMove(uciMove, elapsedMs, evalW);
      }

      async function resolveHint(uciMove) {
        clearEngineTimer();
        const match = /^([a-h][1-8])([a-h][1-8])([qrbn])?$/.exec(uciMove);
        const simulated = match ? replayMoves(game.history()) : null;
        const bestMove = simulated ? simulated.move({ from: match[1], to: match[2], promotion: match[3] || "q" }) : null;
        if (!bestMove) {
          hintThinking = false;
          renderCoach();
          return;
        }
        const history = game.history();
        await askCoach("hint", {
          moveNo: currentMoveNo(),
          lastSan: history.at(-1) || "",
          bestSan: bestMove.san,
          bestFact: moveFact(bestMove, "", "你"),   /* 盤況翻譯官：報答案用人話（哪格的哪顆子走去哪），不丟裸棋譜 */
          facts: boardFacts(game, lastRecordedEvalW()),
          askCount: hintAskCount,
          summary: "玩家主動求救，想知道目前局面的走法"
        });
        hintThinking = false;
        renderCoach();
      }

      function requestHint() {
        if (!canRequestHint()) return;
        hintAskCount += 1;
        hintThinking = true;
        sendEngineCommand("position fen " + game.fen());
        sendEngineCommand("go movetime 500");
        engineTimer = window.setTimeout(failEngine, 10000);
        renderCoach();
      }

      function handleEngineMessage(event) {
        const message = String(event.data).trim();
        if (message === "uciok") {
          engineReady = true;
          sendEngineCommand("setoption name Skill Level value " + DIFFICULTIES[activeDifficulty].skill);
          render();
          requestEngineMove();
          return;
        }

        const parsedEval = parseEvalW(message);
        if (engineThinking && parsedEval !== null) lastSearchEvalW = parsedEval;

        const bestMove = /^bestmove\s+(\S+)/.exec(message);
        if (bestMove && hintThinking) {
          void resolveHint(bestMove[1]);
          return;
        }
        if (bestMove && engineThinking) {
          clearEngineTimer();
          const elapsedMs = Math.round(performance.now() - engineStartedAt);
          const generation = engineGeneration;
          void resolveEngineMove(bestMove[1], lastSearchEvalW, generation, elapsedMs);
        }
      }

      function startEngine() {
        stopEngine();
        engineFailed = false;
        try {
          engine = new Worker("vendor/stockfish-18-lite-single.js");
          engine.addEventListener("message", handleEngineMessage);
          engine.addEventListener("error", failEngine, { once: true });
          sendEngineCommand("uci");
        } catch (_error) {
          failEngine();
        }
      }

      function requestEngineMove() {
        if (!isComputerMode() || !engineReady || engineThinking || hintThinking || engineFailed || game.game_over() || game.turn() !== "b") return;
        engineThinking = true;
        engineStartedAt = performance.now();
        lastSearchEvalW = null;
        sendEngineCommand("position fen " + game.fen());
        sendEngineCommand("go movetime " + DIFFICULTIES[activeDifficulty].movetime);
        engineTimer = window.setTimeout(failEngine, 10000);
        render();
      }

      function handleSquareClick(square) {
        if (game.game_over() || isBoardLocked()) return;
        if (isComputerMode() && game.turn() !== "w") return;

        const destination = legalMoves.find(move => move.to === square);
        if (selectedSquare && destination) {
          const move = game.move({ from: selectedSquare, to: square, promotion: "q" });
          hintAskCount = 0;
          if (isComputerMode()) {
            // 事件流實錄：時間軸不從棋譜倒推，發生什麼記什麼（悔棋才對得上，業主 08-28 抓包）
            coachTranscript.push({ who: "sys", kind: "move", text: "第 " + Math.ceil(game.history().length / 2) + " 手　玩家 " + move.san, moveNo: Math.ceil(game.history().length / 2), shownAt: performance.now() });
          }
          clearSelection();
          saveGame();
          render();
          if (game.game_over()) void handleHumanGameOver(move.san);
          else requestEngineMove();
          return;
        }

        if (!selectedSquare) {
          const piece = game.get(square);
          if (piece && piece.color === game.turn()) {
            selectedSquare = square;
            legalMoves = game.moves({ square, verbose: true });
            renderBoard();
          }
          return;
        }

        clearSelection();
        renderBoard();
      }

      boardElement.addEventListener("click", event => {
        const square = event.target.closest(".square");
        if (square) handleSquareClick(square.dataset.square);
      });

      undoButton.addEventListener("click", () => {
        if (isComputerMode()) {
          const hadMoves = game.history().length > 0;
          if (!hadMoves) return;
          startEngine();
          game.undo();
          if (game.turn() === "b") game.undo();
          lastEngineReply = null;
        } else if (!game.undo()) {
          return;
        }
        const whiteMoveCount = Math.ceil(game.history().length / 2);
        if (isComputerMode()) {
          coachTranscript.push({ who: "sys", kind: "undo", text: "↺ 悔棋（重下第 " + (whiteMoveCount + 1) + " 手）", moveNo: null, shownAt: performance.now() });
        }
        hintAskCount = 0;
        evalHistory = evalHistory.filter(entry => entry.moveNo <= whiteMoveCount);
        // 悔棋不滅口：對話是發生過的事，只把冷卻帳夾回現況
        const priorCoachMove = latestAutomaticCoachMove();
        lastCoachMove = priorCoachMove === null ? null : Math.min(priorCoachMove, whiteMoveCount);
        postgameRequested = false;
        clearSelection();
        if (game.history().length) saveGame();
        else clearSavedGame();
        render();
      });

      function startNewGame() {
        clearSavedGame();
        game = new Chess();
        activeDifficulty = difficultySelect.value;
        lastEngineReply = null;
        coachTranscript = [];
        hintAskCount = 0;
        hintThinking = false;
        chatSending = false;
        evalHistory = [];
        lastCoachMove = null;
        postgameRequested = false;
        coachThinking = false;
        engineCommandLog.length = 0;
        coachRequestLog.length = 0;
        clearSelection();
        difficultyNote.textContent = "";
        if (isComputerMode()) startEngine();
        else {
          stopEngine();
          engineFailed = false;
        }
        render();
        void askCoach("opening", { moveNo: 0, summary: "新局剛開桌，玩家還沒動子" });
      }

      newGameButton.addEventListener("click", startNewGame);

      modeSelect.addEventListener("change", startNewGame);

      difficultySelect.addEventListener("change", () => {
        difficultyNote.textContent = difficultySelect.value === activeDifficulty
          ? ""
          : "已選「" + DIFFICULTIES[difficultySelect.value].label + "」，按新局後生效。";
      });

      coachToggle.addEventListener("click", () => {
        coachEnabled = !coachEnabled;
        rememberCoachEnabled();
        if (!coachEnabled) cancelCoachRequest();
        renderCoach();
      });

      helpButton.addEventListener("click", requestHint);

      // 本局對話浮窗：點任一頭像開（業主 08-28 版型：微透明、右上✕關掉繼續下棋）
      const chatlogOverlay = document.createElement("div");
      chatlogOverlay.className = "chatlog-overlay";
      chatlogOverlay.hidden = true;
      chatlogOverlay.innerHTML = '<div class="chatlog-panel"><div class="chatlog-head"><span class="chatlog-title">本局對話</span>' +
        '<div class="chatlog-actions"><button type="button" class="chatlog-tool chatlog-export">匯出</button>' +
        '<label class="chatlog-tool">匯入<input class="chatlog-import" type="file" accept=".png,.json,.md,.txt,image/png,application/json,text/plain,text/markdown"></label>' +
        '<button type="button" class="chatlog-close" aria-label="關閉">✕</button></div></div>' +
        '<p class="chatlog-status" aria-live="polite"></p><div class="chatlog-body"></div></div>';
      document.body.append(chatlogOverlay);
      const chatlogBody = chatlogOverlay.querySelector(".chatlog-body");
      const chatlogTitle = chatlogOverlay.querySelector(".chatlog-title");
      const chatlogStatus = chatlogOverlay.querySelector(".chatlog-status");
      const chatlogImport = chatlogOverlay.querySelector(".chatlog-import");
      // 匯出／匯入＝設定抽屜「攜帶資料」同一套（記憶包：跨局對話＋講評＋戰績），這裡只是多一個入口
      chatlogOverlay.querySelector(".chatlog-export").addEventListener("click", exportMemory);
      chatlogImport.addEventListener("change", async () => {
        chatlogStatus.textContent = "正在辨識匯入檔…";
        const result = await handleImportInput(chatlogImport);
        chatlogStatus.textContent = elements.cardStatus.textContent;
        if (result && result.kind === "memory") openChatlog();
      });
      function openChatlog() {
        // 標題句數＝跨局記憶（chatHistory，上限 CHAT_CAP），與牌桌「本桌對話（n/100）」同義
        chatlogTitle.textContent = "本局對話（記憶 " + chatHistory.length + "/" + CHAT_CAP + "）";
        // 檢討時間軸＝事件流實錄（業主 08-28 二訂）：走子/他回手/悔棋/對話，發生什麼列什麼——悔棋也在帳上
        chatlogBody.replaceChildren();
        if (!coachTranscript.length) {
          const empty = document.createElement("p");
          empty.className = "cl-empty";
          empty.textContent = "這局還沒說過話。";
          chatlogBody.append(empty);
        }
        if (coachTranscript.some(entry => entry.who !== "sys")) {
          const day = document.createElement("div");
          day.className = "cl-day";
          day.textContent = "── " + localDay().slice(5).replace("-","/") + " ──";
          chatlogBody.append(day);
        }
        for (const entry of coachTranscript) {
          if (entry.who === "sys") {
            const marker = document.createElement("div");
            marker.className = "cl-move" + (entry.kind === "undo" ? " cl-undo" : "");
            marker.textContent = entry.text;
            chatlogBody.append(marker);
            continue;
          }
          const row = document.createElement("div");
          row.className = "cl-row " + entry.who;
          const bubble = document.createElement("div");
          bubble.className = "cl-bubble";
          bubble.textContent = entry.text;
          row.append(bubble);
          chatlogBody.append(row);
        }
        chatlogOverlay.hidden = false;
        chatlogBody.scrollTop = chatlogBody.scrollHeight;
      }
      chatlogOverlay.addEventListener("click", event => {
        if (event.target === chatlogOverlay || event.target.closest(".chatlog-close")) chatlogOverlay.hidden = true;
      });
      document.querySelector(".avatar-him").addEventListener("click", openChatlog);
      document.querySelector(".avatar-her").addEventListener("click", openChatlog);

      chatForm.addEventListener("submit", async event => {
        event.preventDefault();
        if (!isComputerMode() || !coachEnabled || chatSending || hintThinking || activeCoachController !== null) return;
        const text = chatInput.value.trim().slice(0, 300);
        if (!text) return;

        const history = game.history();
        const moveNo = currentMoveNo();
        chatSending = true;
        chatInput.value = "";
        coachTranscript.push({ who: "her", text, moveNo, trigger: "chat", shownAt: performance.now() });
        chatHistory.push({ who: "you", text, d: localDay() });
        chatHistory = chatHistory.slice(-CHAT_CAP);
        saveChat();
        saveGame();
        renderCoach();

        try {
          const verboseHistory = game.history({ verbose: true });
          await askCoach("chat", {
            text,
            moveNo,
            // 玩家與引擎的手分開餵，避免把角色自己的棋算到玩家頭上。
            lastSan: history.filter((_s, i) => i % 2 === 0).at(-1) || "",
            engineSan: history.filter((_s, i) => i % 2 === 1).at(-1) || "",
            lastFact: moveFact(verboseHistory.filter((_m, i) => i % 2 === 0).at(-1), "玩家", "你"),
            engineFact: moveFact(verboseHistory.filter((_m, i) => i % 2 === 1).at(-1), "你", "玩家"),
            facts: boardFacts(game, lastRecordedEvalW()),
            summary: "玩家主動跟角色說話"
          });
        } finally {
          chatSending = false;
          renderCoach();
          chatInput.focus();
        }
      });

      function showHerAvatarFallback() {
        herAvatar.hidden = true;
        herAvatarFallback.hidden = false;
      }

      herAvatar.addEventListener("error", showHerAvatarFallback, { once: true });
      if (herAvatar.complete && herAvatar.naturalWidth === 0) showHerAvatarFallback();

      settingsToForm();
      restoreChat();
      renderIdentity();

      elements.settingButton.addEventListener("click",() => { elements.settingsOverlay.hidden = false; elements.endpointInput.focus(); });
      elements.settingsOverlay.addEventListener("click",event => { if (event.target === elements.settingsOverlay || event.target.closest("[data-close-settings]")) { persistSettings(); elements.settingsOverlay.hidden = true; } });
      const persistUnlessFile = event => { if (event.target && event.target.type === "file") return; persistSettings(); };
      elements.settingsForm.addEventListener("input",persistUnlessFile);
      elements.settingsForm.addEventListener("change",persistUnlessFile);
      document.querySelectorAll("[data-endpoint-preset]").forEach(button => button.addEventListener("click",() => {
        const preset = button.dataset.endpointPreset;
        elements.endpointInput.value = preset === "google" ? "https:" + "//generativelanguage.googleapis.com/v1beta/openai" : preset === "openrouter" ? "https:" + "//openrouter.ai/api/v1" : "";
        persistSettings();
        if (preset === "custom") elements.endpointInput.focus();
      }));
      elements.toggleKeyButton.addEventListener("click",() => { const showing = elements.apiKeyInput.type === "text"; elements.apiKeyInput.type = showing ? "password" : "text"; elements.toggleKeyButton.textContent = showing ? "顯示" : "隱藏"; });
      elements.loadModelsButton.addEventListener("click",() => void loadModels());
      elements.modelSelect.addEventListener("change",() => { if (!elements.modelSelect.value) return; elements.modelInput.value = elements.modelSelect.value; persistSettings(); elements.modelStatus.textContent = "已選 " + elements.modelSelect.value; });
      elements.cardFileInput.addEventListener("change",() => void handleImportInput(elements.cardFileInput));
      elements.memoryFileInput.addEventListener("change",() => void handleImportInput(elements.memoryFileInput));
      elements.exportCardButton.addEventListener("click",exportCard);
      elements.exportMemoryButton.addEventListener("click",exportMemory);
      elements.himAvatarInput.addEventListener("change",async () => { const file = elements.himAvatarInput.files?.[0]; if (!file) return; elements.avatarStatus.textContent = "正在處理他的頭像…"; try { await setAvatarFromFile(file,"avatarDataUrl"); elements.avatarStatus.textContent = "他的頭像已儲存。"; } catch (error) { elements.avatarStatus.textContent = "頭像失敗：" + (error?.message || "未知原因"); } finally { elements.himAvatarInput.value = ""; } });
      elements.playerAvatarInput.addEventListener("change",async () => { const file = elements.playerAvatarInput.files?.[0]; if (!file) return; elements.avatarStatus.textContent = "正在處理你的頭像…"; try { await setAvatarFromFile(file,"playerAvatarDataUrl"); elements.avatarStatus.textContent = "你的頭像已儲存。"; } catch (error) { elements.avatarStatus.textContent = "頭像失敗：" + (error?.message || "未知原因"); } finally { elements.playerAvatarInput.value = ""; } });
      elements.clearButton.addEventListener("click",() => clearAllData(false));
      document.addEventListener("keydown",event => { if (event.key === "Escape") { elements.settingsOverlay.hidden = true; chatlogOverlay.hidden = true; } });

      if (restoreSavedGame()) {
        if (isComputerMode()) startEngine();
        else {
          stopEngine();
          engineFailed = false;
        }
        render();
      } else {
        startNewGame();
      }

      function runSelfTest() {
        const opening = new Chess();
        const openingMoves = opening.moves().length;
        const initialFen = opening.fen();
        const illegalResult = opening.move({ from: "e2", to: "e5", promotion: "q" });

        const clickSample = new Chess();
        const sampledMoves = [
          { from: "e2", to: "e4" },
          { from: "e7", to: "e5" },
          { from: "g1", to: "f3" }
        ];
        const clickablePlies = sampledMoves.filter(move => clickSample.move(move)).length;

        // 盤況翻譯官自測：1.d4 d5 2.e4 的 e4 兵懸空，d5 有皇后保護。
        const translator = new Chess();
        ["d4", "d5", "e4"].forEach(move => translator.move(move));
        const translatorFacts = boardFacts(translator, 40);
        const translatorHistory = translator.history({ verbose: true });
        const captureGame = new Chess();
        ["d4", "d5", "e4", "dxe4"].forEach(move => captureGame.move(move));
        const captureFact = moveFact(captureGame.history({ verbose: true }).at(-1), "你", "玩家");

        const scholar = new Chess();
        ["e4", "e5", "Bc4", "Nc6", "Qh5", "Nf6", "Qxf7#"].forEach(move => scholar.move(move));
        const scholarGameOver = scholar.game_over();
        const beforeUndoHistory = scholar.history().length;
        const beforeUndoFen = scholar.fen();
        scholar.undo();

        const results = Object.freeze({
          a_openingMoves: openingMoves,
          a_clickablePlies: clickablePlies,
          b_illegalRejected: illegalResult === null,
          b_boardUnchanged: opening.fen() === initialFen,
          c_gameOver: scholarGameOver,
          d_historyBefore: beforeUndoHistory,
          d_historyAfter: scholar.history().length,
          d_boardRolledBack: scholar.get("h5")?.type === "q" && scholar.get("f7")?.type === "p",
          e_evalCpWhiteSign: parseEvalW("info depth 8 score cp 23 nodes 10") === -23,
          e_evalMateWhiteSign: parseEvalW("info depth 8 score mate 3 nodes 10") === -10000,
          f_moveFact: moveFact(translatorHistory.at(-1), "玩家", "你") === "玩家把 e2 的小兵走到 e4",
          f_captureFact: captureFact === "你用 d5 的小兵吃掉玩家 e4 的小兵",
          f_hangingPawnSpotted: translatorFacts.some(fact => fact.includes("玩家 e4 的小兵") && fact.includes("沒有子保護")),
          f_defendedNotFlagged: !translatorFacts.some(fact => fact.startsWith("威脅：") && fact.includes("d5")),
          f_landingPlayer: translatorFacts.some(fact => fact.startsWith("玩家剛走到 e4 的小兵：在白方這半邊") && fact.includes("正被你的小兵攻擊") && fact.includes("沒有子保護")),
          f_landingHim: translatorFacts.some(fact => fact.startsWith("你剛走到 d5 的小兵：在黑方這半邊") && fact.includes("正被玩家的小兵攻擊") && fact.includes("有 1 顆子保護")),
          f_evalWordSign: evalFact(-250) === "引擎判定：你明顯佔優（約 2.5 個兵的價值）",
          f_materialEven: materialFact(translator) === "子力：雙方相當"
        });
        console.info("[西洋棋一期自測] " + JSON.stringify(results));
        return results;
      }

      window.chessSelfTest = runSelfTest();
      window.echecsTest = Object.freeze({
        selfTest: runSelfTest,
        snapshot: () => Object.freeze({
          mode: modeSelect.value,
          selectedDifficulty: difficultySelect.value,
          activeDifficulty,
          history: game.history(),
          turn: game.turn(),
          engineReady,
          engineThinking,
          engineFailed,
          boardLocked: isBoardLocked(),
          lastEngineReply,
          commands: engineCommandLog.map(entry => entry.command),
          coachEnabled,
          coachThinking,
          hintThinking,
          hintAskCount,
          chatSending,
          settings: { ...settings, apiKey: settings.apiKey ? "(set)" : "" },
          records: { ...records },
          games: readJson(GAMES_KEY,[]),
          chatHistory: chatHistory.map(entry => ({ ...entry })),
          coachTranscript: coachTranscript.map(entry => ({ ...entry })),
          evalHistory: evalHistory.map(entry => ({ ...entry })),
          coachRequests: coachRequestLog.map(entry => ({ ...entry })),
          hintRequests: coachRequestLog.filter(entry => entry.trigger === "hint").map(entry => ({ ...entry })),
          chatRequests: coachRequestLog.filter(entry => entry.trigger === "chat").map(entry => ({ ...entry })),
          saved: (() => {
            try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); }
            catch (_error) { return null; }
          })()
        }),
        parseEvalW,
        normalizeCharacterCard,
        parseTavernPngBytes,
        parseCardFile,
        applyParsedCard,
        importJsonPayload,
        cardPackage,
        memoryPackage,
        exportCard,
        exportMemory,
        loadModels,
        buildMessages,
        buildTrigger,
        postprocess,
        setSettings(next) { settings = { ...settings, ...next }; settingsToForm(); persistSettings(); return { ...settings, apiKey: settings.apiKey ? "(set)" : "" }; },
        clearAllData() { return clearAllData(true); },
        async request(trigger,details = {}) { return askCoach(trigger,{ moveNo: currentMoveNo(), summary: "測試觸發", ...details }); },
        setGameMoves(moves) {
          stopEngine();
          const next = new Chess();
          for (const move of moves) if (!next.move(move)) throw new Error("無效測試走法：" + move);
          game = next;
          postgameRequested = false;
          evalHistory = [];
          coachTranscript = [];
          render();
          return game.history();
        },
        requestPostgame,
        startNewGame
      });
    })();
  </script>
</body>
