<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="讓角色坐在對面，陪你下西洋棋、看盤講評，也記得你反覆犯的錯。">
  <title>Échecs</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Échecs">
  <!-- iOS 不理 viewport 的 user-scalable，鎖縮放要靠這兩味（行事曆同配方）：gesturestart 擋捏合、touch-action 擋雙擊放大 -->
  <script>document.addEventListener('gesturestart', function (e) { e.preventDefault(); });</script>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      --ink: #4a3728;
      --muted: #77675b;
      --paper: #fbf6ed;
      --panel: rgba(255, 252, 246, .92);
      --line: #ecd8da;
      --light-square: #ead8bd;
      --dark-square: #9b6a45;
      --accent: #b76e79;   /* 原綠 #315f4d，業主 08-28 掃綠令：全室字與鈕禁綠 */
      --warning: #9e3e30;
    }

    * { box-sizing: border-box; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    html, body { touch-action: manipulation; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      /* 底色統一棋室大廳 #f7eef0 素色（業主 08-28 二度抓包：白色柔光漸層會跟狀態列撞出色差線，拆） */
      background: #f7eef0;
    }

    button, select, input, textarea { font: inherit; }

    .app {
      width: min(1120px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(14px, 3vw, 34px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(240px, 320px);
      align-items: center;
      gap: clamp(18px, 4vw, 44px);
    }

    .play-area { min-width: 0; }

    .heading {
      display: flex;
      align-items: center;   /* baseline 會讓兩顆藥丸歪掉（業主 08-28：「他們是歪的！！！」） */
      justify-content: space-between;
      gap: 12px;
      margin: 0 auto 12px;
      width: min(74vh, 100%);
    }

    h1 {
      margin: 0;
      /* 草寫花體 Chess（業主 08-28 欽點）：iOS=Snell Roundhand、Windows=Segoe Script，逐層退 */
      font-family: "Snell Roundhand", "Savoye LET", "Segoe Script", "Brush Script MT", cursive;
      font-size: clamp(1.9rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: .02em;
      color: #8a5560;
      line-height: 1;
    }

    .turn-badge {
      flex: none;
      padding: 5px 12px;
      min-height: 34px;
      display: flex;
      align-items: center;
      border: 1px solid #d9b2b8;   /* 與教練鈕同款玫瑰皮，鄰居不吵架（業主 08-28） */
      border-radius: 999px;
      color: #a05f6a;
      background: #fdf7f8;
      font-size: .74rem;
      font-weight: 800;
    }

    /* 回棋室：右上素字（家格式，同對局史 back-link）；相對路徑 ../chambre/ 在 GitHub Pages 同 origin 下指向大廳 */
    .home-link { flex: none; padding: 8px 0; color: #a08a8d; text-decoration: none; font-size: .82rem; -webkit-tap-highlight-color: transparent; }
    .home-link:active { color: #b76e79; }
    .setting-button { flex: none; min-height: 34px; padding: 5px 11px; border: 1px solid #d9b2b8; border-radius: 999px; color: #a05f6a; background: #fdf7f8; cursor: pointer; font-size: .76rem; font-weight: 800; }

    .board-stage {
      position: relative;
      width: min(74vh, 100%);
      margin: auto;
      padding: 84px 0 70px;   /* 邊帶＝頭像和泡泡的家：角色在上、玩家在下 */
    }

    .board-frame {
      width: 100%;
      padding: clamp(5px, 1.2vw, 10px);
      border-radius: 8px;
      background: #513a2b;
      box-shadow: 0 12px 35px rgba(56, 38, 24, .24), inset 0 0 0 1px rgba(255,255,255,.16);
    }

    .coach-tools[hidden], .chat-row[hidden] { display: none; }
    .board-stage.two-player .avatar, .board-stage.two-player .bubble-stack { display: none; }
    .board-stage.coach-off .avatar, .board-stage.coach-off .bubble-stack { display: none; }   /* 教練關＝對座整組收（業主 08-28 點單） */

    /* 本局對話浮窗（點頭像開，微透明玻璃，右上✕關掉繼續下棋） */
    .chatlog-overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: rgba(58, 44, 34, .28); }
    .chatlog-overlay[hidden] { display: none; }
    .chatlog-panel { position: relative; display: flex; flex-direction: column; width: min(440px, 92vw); max-height: 74vh;
      border-radius: 16px; border: 1px solid rgba(122, 95, 73, .25); overflow: hidden;
      background: rgba(251, 246, 237, .88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 18px 44px rgba(48, 38, 31, .3); }
    .chatlog-head { flex: none; display: flex; align-items: center; justify-content: space-between;
      padding: 12px 12px 10px 18px; border-bottom: 1px solid rgba(122, 95, 73, .12); }   /* 表頭常駐：✕不用滑回去找（業主 08-28） */
    .chatlog-body { flex: 1; overflow-y: auto; padding: 8px 16px 18px; }
    .chatlog-actions { display: flex; align-items: center; gap: 6px; }
    .chatlog-status { flex: none; margin: 0; padding: 6px 18px 0; color: #a08a8d; font-size: .76rem; }
    .chatlog-status:empty { display: none; }
    .chatlog-close { width: 30px; height: 30px; border: 0; border-radius: 50%;
      background: rgba(183, 110, 121, .16); color: #8a5560; font-size: 1rem; cursor: pointer; }
    .chatlog-title { font-size: .78rem; letter-spacing: .18em; color: #a08a8d; }
    .cl-row { display: flex; margin: 7px 0; }
    .cl-row.her { justify-content: flex-end; }
    .cl-bubble { max-width: 82%; padding: 8px 11px; font-size: .9rem; line-height: 1.55;
      border: 1px solid rgba(122, 95, 73, .16); }
    .cl-row.him .cl-bubble { background: #fff; border-radius: 4px 13px 13px 13px; }
    .cl-row.her .cl-bubble { background: var(--her-bub, #f0e0e2); color: var(--her-fg, inherit); border-radius: 13px 4px 13px 13px; }
    .cl-empty { text-align: center; color: #a08a8d; font-size: .85rem; padding: 20px 0; }
    .cl-move { text-align: center; color: #a08a8d; font-size: .7rem; letter-spacing: .1em; margin: 12px 0 4px; }
    .cl-move.cl-undo { color: #b76e79; font-weight: 700; }

    .avatar {
      position: absolute;
      z-index: 12;
      cursor: pointer;
      width: 50px;
      height: 50px;
      overflow: hidden;
      border: 3px solid #fffaf3;
      border-radius: 50%;
      background: #8d796b;
      box-shadow: 0 3px 12px rgba(48, 38, 31, .3);
    }

    .avatar img, .avatar-fallback {
      display: block;
      width: 100%;
      height: 100%;
    }

    .avatar img { object-fit: cover; }
    .avatar-fallback { display: grid; place-items: center; color: #fff; background: #bd8d83; font-weight: 800; }
    .avatar img[hidden] { display: none; }
    .avatar-fallback[hidden] { display: none; }
    .avatar-him { top: 0; left: -9px; }
    .avatar-her { right: -9px; bottom: 0; }

    .bubble-stack {
      position: absolute;
      z-index: 11;
      display: flex;
      width: calc(100% - 58px);
      pointer-events: none;
    }

    /* 泡泡只准往棋盤外長：角色往上疊、玩家往下疊 */
    .bubble-stack-him {
      top: auto;
      bottom: calc(100% - 80px);
      left: 64px;
      width: calc(100% - 70px);
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
    }

    .bubble-stack-her {
      top: calc(100% - 66px);
      bottom: auto;
      right: 64px;
      width: calc(100% - 70px);
      flex-direction: column;
      align-items: flex-end;
    }

    .coach-bubble {
      position: relative;
      width: fit-content;
      max-width: min(96%, 560px);   /* 一句話盡量一行內講完，少壓棋盤（業主 08-28 點單加寬） */
      margin: 0 0 6px;
      padding: 8px 11px;
      border: 1px solid rgba(122, 95, 73, .18);
      border-radius: 5px 13px 13px 13px;
      color: #3b3028;
      background: rgba(255, 250, 243, .96);
      box-shadow: 0 2px 9px rgba(72, 51, 36, .18);
      font-size: .84rem;
      line-height: 1.5;
      transform-origin: 0 0;
    }
    .coach-bubble.pop { animation: coach-pop .22s ease-out both; }   /* 動畫只給新句：重畫不重閃（業主 08-28 抓包） */

    .coach-bubble.her {
      border-radius: 13px 5px 13px 13px;
      color: var(--her-fg, #553c42);
      background: var(--her-bub, rgba(240, 224, 226, .97));   /* 玩家泡泡＝淡玫瑰（同牌桌公開版）；家版靠 theme.json 覆蓋成深玫瑰，公開版沒有主題檔，預設值就是成品色，禁綠 */
      transform-origin: 100% 100%;
    }

    .coach-thinking {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 6px;
      padding: 7px 10px;
      border: 1px solid rgba(122, 95, 73, .16);
      border-radius: 5px 12px 12px 12px;
      color: var(--muted);
      background: rgba(255, 250, 243, .94);
      box-shadow: 0 2px 9px rgba(72, 51, 36, .14);
      font-size: .76rem;
      animation: coach-pop .22s ease-out both;
    }

    @keyframes coach-pop {
      from { opacity: 0; transform: scale(.84); }
      to { opacity: 1; transform: scale(1); }
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);   /* 沒定列高＝空列會縮，棋盤走著走著變長方形（2026-08-28 業主抓包） */
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid rgba(49, 31, 20, .35);
    }

    .square {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      color: #17130f;
      background: var(--light-square);
      cursor: default;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .square.dark { background: var(--dark-square); }
    .square.selectable, .square.legal { cursor: pointer; }

    .square:focus-visible {
      z-index: 5;
      outline: 3px solid #fff;
      outline-offset: -4px;
    }

    .square.selected::after {
      content: "";
      position: absolute;
      inset: 7%;
      border: clamp(2px, .4vw, 4px) solid #f4c84f;
      border-radius: 5px;
      box-shadow: inset 0 0 0 1px rgba(54, 39, 18, .35);
      pointer-events: none;
    }

    .square.legal::before {
      content: "";
      position: absolute;
      z-index: 2;
      width: 25%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(29, 93, 67, .63);
      box-shadow: 0 0 0 2px rgba(255,255,255,.32);
      pointer-events: none;
    }

    /* 將軍可視化：兇手紅圈、路線淡紅、國王紅框 */
    .square.check-source::after {
      content: "";
      position: absolute;
      inset: 6%;
      border: clamp(2px, .45vw, 4px) solid rgba(178, 34, 34, .85);
      border-radius: 50%;
      pointer-events: none;
    }
    .square.check-path { box-shadow: inset 0 0 0 100vmax rgba(178, 34, 34, .18); }
    .square.check-king { box-shadow: inset 0 0 0 clamp(3px, .5vw, 5px) rgba(178, 34, 34, .8); }

    .square.legal.capture::before {
      width: 76%;
      background: transparent;
      border: clamp(3px, .6vw, 6px) solid rgba(29, 93, 67, .72);
      box-shadow: none;
    }

    .piece {
      position: relative;
      z-index: 1;
      font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", serif;
      font-size: clamp(1.85rem, min(7.2vw, 8.4vh), 4.9rem);
      line-height: 1;
      transform: translateY(-2%);
      text-shadow: 0 1px 1px rgba(255,255,255,.55);
    }

    .piece.black {
      color: #16130f;
      text-shadow: 0 1px 1px rgba(255,255,255,.35);
    }

    .piece.white {
      color: #fffaf0;
      text-shadow: 0 1px 1px #2f251e, 1px 0 1px #2f251e, -1px 0 1px #2f251e, 0 -1px 1px #2f251e;
    }

    .coord {
      position: absolute;
      z-index: 3;
      font-size: clamp(.55rem, 1.4vw, .76rem);
      font-weight: 800;
      line-height: 1;
      pointer-events: none;
    }

    .coord.file { right: 5px; bottom: 4px; }
    .coord.rank { left: 5px; top: 4px; }
    .square:not(.dark) .coord { color: #855b3e; }
    .square.dark .coord { color: #f0ddbf; }

    .panel {
      min-height: 420px;
      max-height: min(74vh, 680px);
      display: flex;
      flex-direction: column;
      padding: clamp(16px, 2.6vw, 24px);
      border: 1px solid rgba(122, 95, 73, .2);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 9px 28px rgba(72, 51, 36, .12);
    }

    #status {
      margin: 0 0 16px;
      padding: 12px 14px;
      border-left: 4px solid var(--accent);
      border-radius: 4px;
      background: #f9edf0;
      font-weight: 750;
      line-height: 1.45;
    }

    #status.check { color: var(--warning); border-color: var(--warning); background: #faece8; }
    #status.game-over { color: #5b351d; border-color: #b77a31; background: #f8ead7; }

    .panel h2 {
      margin: 0 0 9px;
      font-size: .82rem;
      color: var(--muted);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 0 0 16px;
    }

    .setting {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 750;
    }

    .setting select {
      width: 100%;
      min-height: 42px;
      padding: 7px 30px 7px 9px;
      border: 1px solid #bca790;
      border-radius: 8px;
      color: var(--ink);
      background: #fffaf3;
    }

    .setting select:focus-visible { outline: 3px solid rgba(183,110,121,.35); outline-offset: 2px; }

    .coach-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: min(74vh, 100%);
      margin: 2px auto 10px;
    }

    /* 按鈕全家改乾燥玫瑰系（業主 08-28 點單）；開關住標題列、求救搬進輸入列與送出同款 */
    .coach-toggle {
      min-height: 34px;
      padding: 5px 12px;
      margin-left: auto;
      border: 1px solid #d9b2b8;
      border-radius: 999px;
      color: #a05f6a;
      background: #fdf7f8;
      cursor: pointer;
      font-size: .74rem;
      font-weight: 800;
      align-self: center;
      flex: none;
    }

    .coach-toggle[aria-checked="false"] { color: var(--muted); }
    .coach-toggle:focus-visible { outline: 3px solid rgba(183,110,121,.3); outline-offset: 2px; }

    .help-button:focus-visible, .chat-row input:focus-visible, .chat-row button:focus-visible {
      outline: 3px solid rgba(183,110,121,.3);
      outline-offset: 2px;
    }

    .help-button:disabled { cursor: not-allowed; opacity: .42; }

    .chat-row {
      width: min(74vh, 100%);
      margin: 0 auto 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
    }

    .chat-row input {
      min-width: 0;
      min-height: 44px;
      padding: 8px 11px;
      border: 1px solid #bca790;
      border-radius: 10px;
      color: var(--ink);
      background: #fffaf3;
      font-size: 16px;   /* ≥16px：字夠大＋iOS 聚焦不自動放大頁面（業主 08-28 點單） */
    }

    .chat-row button {
      min-width: 64px;
      min-height: 42px;
      padding: 7px 12px;
      border: 1px solid #a05f6a;
      border-radius: 10px;
      color: #fff;
      background: #b76e79;   /* 乾燥玫瑰主色：送出與求救同款（業主 08-28 點單） */
      cursor: pointer;
      font-weight: 800;
    }

    .chat-row input:disabled, .chat-row button:disabled { cursor: not-allowed; opacity: .55; }

    .thinking-dots { display: inline-flex; gap: 3px; }

    .thinking-dots i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      animation: coach-dot 1.1s infinite ease-in-out;
    }

    .thinking-dots i:nth-child(2) { animation-delay: .15s; }
    .thinking-dots i:nth-child(3) { animation-delay: .3s; }

    @keyframes coach-dot {
      0%, 70%, 100% { transform: translateY(0); opacity: .35; }
      35% { transform: translateY(-3px); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .thinking-dots i, .coach-bubble, .coach-thinking { animation: none; }
    }

    .history-details {
      margin: 0 0 18px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .history-details summary {
      padding: 10px 4px;
      color: var(--muted);
      cursor: pointer;
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .08em;
      list-style-position: inside;
    }

    #history {
      max-height: 210px;
      padding: 0 4px 10px;
      overflow: auto;
    }

    .move-row {
      display: grid;
      grid-template-columns: 2.2rem 1fr 1fr;
      gap: 8px;
      padding: 5px 4px;
      font-variant-numeric: tabular-nums;
    }

    .move-number { color: var(--muted); }
    .empty-history { margin: 8px 4px; color: var(--muted); }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .action {
      min-height: 44px;
      border: 1px solid #d9b2b8;
      border-radius: 8px;
      color: var(--ink);
      background: #fdf7f8;
      cursor: pointer;
      font-weight: 700;
    }

    .action:hover { background: #f7e9eb; }
    a.history-link { display: flex; align-items: center; justify-content: center; margin-top: 10px;
      text-decoration: none; color: var(--ink); font-size: .9rem; }
    .action:focus-visible { outline: 3px solid rgba(183,110,121,.3); outline-offset: 2px; }
    .action:disabled { cursor: not-allowed; opacity: .45; }

    .hint {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.5;
    }

    #difficultyNote { margin-top: 6px; }

    #board.locked .square { cursor: wait; }

    .setup-note { margin: 12px 0 0; padding: 10px 11px; border-radius: 9px; color: #7b5159; background: #f9edf0; font-size: .8rem; line-height: 1.5; }
    .setup-note.ready { color: #79515a; background: #f5e6e9; }
    .chatlog-actions { display: flex; align-items: center; gap: 5px; }
    .chatlog-tool { position: relative; min-height: 30px; padding: 4px 8px; display: grid; place-items: center; border: 1px solid #d9b2b8; border-radius: 7px; color: #87525b; background: #fff; cursor: pointer; font-size: .72rem; font-weight: 800; }
    .chatlog-tool input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .cl-day { text-align: center; color: #a08a8d; font-size: .7rem; letter-spacing: .1em; margin: 12px 0 4px; }
    .drawer-overlay { position: fixed; inset: 0; z-index: 70; display: flex; justify-content: flex-end; background: rgba(58,44,34,.32); }
    .drawer-overlay[hidden] { display: none; }
    .drawer { width: min(480px,100%); height: 100%; overflow-y: auto; background: #fffaf5; box-shadow: -12px 0 36px rgba(48,38,31,.2); }
    .drawer-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 12px 10px 18px; border-bottom: 1px solid rgba(122,95,73,.12); background: #fffaf5; }
    .drawer-head h2 { margin: 0; color: #8a5560; }
    .icon-close { width: 32px; height: 32px; border: 0; border-radius: 50%; color: #8a5560; background: rgba(183,110,121,.16); cursor: pointer; }
    .settings-form { padding: 18px; display: grid; gap: 15px; }
    fieldset { margin: 0; padding: 14px; border: 1px solid var(--line); border-radius: 11px; }
    legend { padding: 0 6px; color: #8a5560; font-weight: 800; }
    .field { display: grid; gap: 5px; margin-bottom: 11px; }
    .field:last-child { margin-bottom: 0; }
    .field label { color: var(--muted); font-size: .8rem; font-weight: 750; }
    .field input, .field textarea, .field select { width: 100%; min-width: 0; padding: 9px 10px; border: 1px solid #bca790; border-radius: 8px; color: var(--ink); background: #fff; font-size: 16px; }
    .field textarea { min-height: 180px; resize: vertical; line-height: 1.5; }
    .inline { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 7px; align-items: stretch; }

    .card-tools, .avatar-upload-grid { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 7px; margin-bottom: 10px; }
    .avatar-upload-grid { grid-template-columns: 1fr 1fr; }
    .avatar-slot { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .avatar-preview { flex: none; width: 44px; height: 44px; overflow: hidden; border: 2px solid #e6d2c4; border-radius: 50%; background: #bd8d83; display: grid; place-items: center; color: #fff; font-weight: 800; }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-preview img[hidden] { display: none; }
    .small-button, .danger-button, .upload-label { min-height: 40px; padding: 7px 11px; border: 1px solid #b9828a; border-radius: 8px; color: #87525b; background: #fff; cursor: pointer; font-weight: 750; }
    .upload-label { position: relative; display: grid; place-items: center; text-align: center; }
    .upload-label input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .danger-button { color: #8c3232; border-color: #c99191; }
    .status { min-height: 1.5em; margin: 0; color: var(--muted); font-size: .8rem; }
    .privacy-mini { margin: 0; color: var(--muted); font-size: .78rem; line-height: 1.55; }

    @media (max-width: 760px) {
      .app {
        min-height: auto;
        display: block;
        padding: 12px;
      }
      .heading, .board-stage, .coach-tools, .chat-row { width: min(94vw, calc(100vh - 170px)); }
      .panel {

      .app { align-items: start; padding-block: 10px; }
      .heading, .board-stage, .coach-tools, .chat-row { width: min(76vh, 100%); }
    }
  </style>
</head>
<body>
  <main class="app">

  <script type="module">
    import { Chess } from "./vendor/chess.js";

    (() => {
      "use strict";

      const PIECES = {
        w: { k: "♔", q: "♕", r: "♖", b: "♗", n: "♘", p: "♙" },
        b: { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" }
      };
      const PIECE_NAMES = { k: "王", q: "后", r: "車", b: "象", n: "馬", p: "兵" };
      const COACH_PIECE_NAMES = { k: "國王", q: "皇后", r: "城堡", b: "主教", n: "騎士", p: "小兵" };   /* 餵嘴用詞跟教練場景設定同一套 */
      const PIECE_VALUES = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
      const FILES = "abcdefgh";
      const DIFFICULTIES = Object.freeze({
        beginner: Object.freeze({ label: "入門", skill: 0, movetime: 200 }),
        easy: Object.freeze({ label: "初級", skill: 3, movetime: 400 }),
        medium: Object.freeze({ label: "中級", skill: 8, movetime: 800 }),
        hard: Object.freeze({ label: "困難", skill: 15, movetime: 1200 })
      });
      const STORE_PREFIX = "publicEchecs_";
      const SETTINGS_KEY = STORE_PREFIX + "settings_v1";
      /* 棋室大廳共用鑰匙（chambre）：同 origin 各房共讀；updatedAt 新的贏，本頁存檔同時回寫（欄位定死，三頁契約；playerSkill 等本頁專屬欄留在自己的鍵） */
      const CHAMBRE_KEY = "chambre_settings_v1";
      const CHAMBRE_FIELDS = ["endpoint","apiKey","model","characterName","characterDescription","playerName","avatarDataUrl","playerAvatarDataUrl"];
      function writeSettings() {
        settings.updatedAt = Date.now();
        safeSet(SETTINGS_KEY,JSON.stringify(settings));
        const shared = { v: 1 };
        for (const field of CHAMBRE_FIELDS) shared[field] = settings[field] ?? "";
        shared.updatedAt = settings.updatedAt;
        safeSet(CHAMBRE_KEY,JSON.stringify(shared));
      }
      const SAVE_KEY = STORE_PREFIX + "save_v1";
      const CHAT_KEY = STORE_PREFIX + "chat_v1";
      const RECORD_KEY = STORE_PREFIX + "records_v1";
      const GAMES_KEY = "echecsGames_v1";
      const COACH_ENABLED_KEY = STORE_PREFIX + "coachEnabled_v1";
      const CHAT_CAP = 100;
      const COACH_TIMEOUT_MS = 20000;
      const ENGINE_MOVE_DELAY_MS = 600;
      const KAOMOJI = Object.freeze(["( ´ ▽ ` )", "(￣▽￣)", "(・ω・)", "(¬_¬)", "(ง •̀_•́)ง", "(｡•̀ᴗ-)✧", "(╯°□°）╯", "(づ｡◕‿‿◕｡)づ"]);
      function safeGet(key) { try { return localStorage.getItem(key); } catch (_error) { return null; } }
      function safeSet(key,value) { try { localStorage.setItem(key,value); return true; } catch (_error) { return false; } }
      function readJson(key,fallback) { try { const value = JSON.parse(safeGet(key) || "null"); return value ?? fallback; } catch (_error) { return fallback; } }
      function defaultSettings() { return { endpoint: "", apiKey: "", model: "", characterName: "", characterDescription: "", playerName: "你", playerSkill: "beginner", avatarDataUrl: "", playerAvatarDataUrl: "" }; }
      function readSettings() {
        const own = { ...defaultSettings(), ...readJson(SETTINGS_KEY,{}) };
        const shared = readJson(CHAMBRE_KEY,null);
        if (shared && typeof shared === "object" && Number(shared.updatedAt || 0) > Number(own.updatedAt || 0)) {
          for (const field of CHAMBRE_FIELDS) if (typeof shared[field] === "string") own[field] = shared[field];
          own.updatedAt = Number(shared.updatedAt);
        }
        return own;
      }
      function settingsComplete(value = settings) { return Boolean(value.endpoint.trim() && value.apiKey.trim() && value.model.trim() && value.characterName.trim()); }
      function localDay() { return new Date(Date.now() - new Date().getTimezoneOffset() * 60000 - 4 * 3600 * 1000).toISOString().slice(0,10); }
      function blankRecords() { return { player: 0, character: 0, draw: 0 }; }
      function readRecords() { const raw = readJson(RECORD_KEY,{}); const out = blankRecords(); for (const key of Object.keys(out)) if (Number.isInteger(raw?.[key]) && raw[key] >= 0) out[key] = raw[key]; return out; }
      const boardElement = document.querySelector("#board");
      const statusElement = document.querySelector("#status");
      const turnBadge = document.querySelector("#turnBadge");
      const historyElement = document.querySelector("#history");
      const undoButton = document.querySelector("#undoButton");
      const newGameButton = document.querySelector("#newGameButton");
      const modeSelect = document.querySelector("#modeSelect");
      const difficultySelect = document.querySelector("#difficultySelect");
      const difficultyNote = document.querySelector("#difficultyNote");
      const coachStage = document.querySelector("#coachStage");
      const coachTools = document.querySelector("#coachTools");
      const coachToggle = document.querySelector("#coachToggle");
      const himBubbleStack = document.querySelector("#himBubbleStack");
      const herBubbleStack = document.querySelector("#herBubbleStack");
      const herAvatar = document.querySelector("#herAvatar");
      const herAvatarFallback = document.querySelector("#herAvatarFallback");
      const helpButton = document.querySelector("#helpButton");
      const chatForm = document.querySelector("#chatForm");
      const chatInput = document.querySelector("#chatInput");
      const chatSendButton = document.querySelector("#chatSendButton");
      const historyCount = document.querySelector("#historyCount");
      const elements = Object.fromEntries(Array.from(document.querySelectorAll("[id]")).map(node => [node.id,node]));

      let game = new Chess();
      let selectedSquare = null;
      let legalMoves = [];
      let activeDifficulty = difficultySelect.value;
      let engine = null;
      let engineReady = false;
      let engineThinking = false;
      let engineFailed = false;
      let engineTimer = null;
      let engineStartedAt = 0;
      let lastEngineReply = null;
      let lastSearchEvalW = null;
      let engineGeneration = 0;
      let coachEnabled = readCoachEnabled();
      let coachThinking = false;
      let activeCoachController = null;
      let coachTranscript = [];
      let hintThinking = false;
      let hintAskCount = 0;
      let chatSending = false;
      let evalHistory = [];
      let lastCoachMove = null;
      let postgameRequested = false;
      let settings = readSettings();
      let chatHistory = [];
      let records = readRecords();
      const engineCommandLog = [];
      const coachRequestLog = [];

      function restoreChat() {
        const rows = readJson(CHAT_KEY,[]);
        if (!Array.isArray(rows)) return;
        chatHistory = rows.filter(row => row && (row.who === "him" || row.who === "you")).slice(-CHAT_CAP).map(row => ({ who: row.who, text: String(row.text || ""), d: String(row.d || localDay()) }));
      }

      function saveChat() {
        safeSet(CHAT_KEY,JSON.stringify(chatHistory.filter(row => row.who === "him" || row.who === "you").slice(-CHAT_CAP).map(row => ({ who: row.who, text: row.text, d: row.d || localDay() }))));
      }

      function renderIdentity() {
        const name = settings.characterName.trim() || "角色";
        elements.himAvatarFallback.textContent = Array.from(name)[0] || "角";
        if (settings.avatarDataUrl) { elements.himAvatar.src = settings.avatarDataUrl; elements.himAvatar.hidden = false; elements.himAvatarFallback.hidden = true; }
        else { elements.himAvatar.removeAttribute("src"); elements.himAvatar.hidden = true; elements.himAvatarFallback.hidden = false; }
        if (settings.playerAvatarDataUrl) { elements.herAvatar.src = settings.playerAvatarDataUrl; elements.herAvatar.hidden = false; elements.herAvatarFallback.hidden = true; }
        else { elements.herAvatar.removeAttribute("src"); elements.herAvatar.hidden = true; elements.herAvatarFallback.hidden = false; }
        if (settings.avatarDataUrl) { elements.himAvatarPreview.src = settings.avatarDataUrl; elements.himAvatarPreview.hidden = false; elements.himPreviewEmpty.hidden = true; }
        else { elements.himAvatarPreview.removeAttribute("src"); elements.himAvatarPreview.hidden = true; elements.himPreviewEmpty.hidden = false; }
        if (settings.playerAvatarDataUrl) { elements.playerAvatarPreview.src = settings.playerAvatarDataUrl; elements.playerAvatarPreview.hidden = false; elements.playerPreviewEmpty.hidden = true; }
        else { elements.playerAvatarPreview.removeAttribute("src"); elements.playerAvatarPreview.hidden = true; elements.playerPreviewEmpty.hidden = false; }
        elements.setupNote.textContent = settingsComplete() ? name + " 已就座" : "設定完成後他會開口";
        elements.setupNote.classList.toggle("ready",settingsComplete());
      }

      function flattenObject(value,prefix = "",out = []) {
        if (value === null || value === undefined) return out;
        if (typeof value !== "object") { out.push((prefix ? prefix + ": " : "") + String(value)); return out; }
        if (Array.isArray(value)) { value.forEach((item,index) => flattenObject(item,prefix ? prefix + "[" + index + "]" : String(index),out)); return out; }
        Object.entries(value).forEach(([key,item]) => flattenObject(item,prefix ? prefix + "." + key : key,out)); return out;
      }

      function normalizeCharacterCard(raw) {
        if (!raw || typeof raw !== "object" || Array.isArray(raw)) throw new Error("角色卡不是物件");
        const card = raw.spec === "chara_card_v2" && raw.data && typeof raw.data === "object" ? raw.data : raw.data && raw.name === undefined && typeof raw.data === "object" ? raw.data : raw;
        const standard = ["description","personality","scenario","mes_example"].some(key => typeof card[key] === "string");
        if (!standard) return { name: String(card.character_name || card.char_name || card.title || card.name || "").trim(), description: flattenObject(card).join("\n") };
        const blocks = [];
        for (const key of ["description","personality","scenario"]) if (String(card[key] || "").trim()) blocks.push(String(card[key]).trim());
        const sample = String(card.mes_example || "").trim().slice(0,600);
        if (sample) blocks.push("【語氣樣本】\n" + sample);
        return { name: String(card.name || card.character_name || "").trim(), description: blocks.join("\n\n") };
      }

      function bytesToText(bytes) { return new TextDecoder("utf-8",{ fatal: false }).decode(bytes); }
      function base64ToBytes(text) { const binary = atob(String(text).replace(/\s/g,"")); return Uint8Array.from(binary,char => char.charCodeAt(0)); }
      function parseTavernPngBytes(bytes) {
        const signature = [137,80,78,71,13,10,26,10];
        if (bytes.length < 8 || signature.some((value,index) => bytes[index] !== value)) throw new Error("不是 PNG 檔");
        const view = new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength); let offset = 8;
        while (offset + 12 <= bytes.length) {
          const length = view.getUint32(offset); const type = bytesToText(bytes.slice(offset + 4,offset + 8)); const start = offset + 8, end = start + length;
          if (end + 4 > bytes.length) throw new Error("PNG 區塊不完整");
          if (type === "tEXt") {
            const chunk = bytes.slice(start,end), zero = chunk.indexOf(0), key = zero >= 0 ? bytesToText(chunk.slice(0,zero)) : "";
            if (key === "chara") return JSON.parse(bytesToText(base64ToBytes(bytesToText(chunk.slice(zero + 1)))));
          }
          offset = end + 4;
        }
        throw new Error("PNG 裡找不到 chara 角色卡");
      }

      function readFileBytes(file) { return file.arrayBuffer().then(buffer => new Uint8Array(buffer)); }
      function readFileText(file) { return file.text(); }
      async function resizeAvatar(file,maxSize = 256) {
        let bitmap = null;
        try { bitmap = await createImageBitmap(file); } catch (_error) { bitmap = null; }
        if (!bitmap) {
          const dataUrl = await new Promise((resolve,reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error("讀檔失敗")); reader.readAsDataURL(file); });
          bitmap = await new Promise((resolve,reject) => { const image = new Image(); image.onload = () => resolve(image); image.onerror = () => reject(new Error("圖片解不開，請改用 JPEG 或 PNG")); image.src = dataUrl; });
        }
        const width = bitmap.naturalWidth || bitmap.width, height = bitmap.naturalHeight || bitmap.height;
        if (!width || !height) throw new Error("圖片尺寸讀不到");
        const scale = Math.min(1,maxSize / Math.max(width,height));
        const canvas = document.createElement("canvas"); canvas.width = Math.max(1,Math.round(width * scale)); canvas.height = Math.max(1,Math.round(height * scale));
        canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);
        const out = canvas.toDataURL("image/jpeg",0.85);
        if (!out || out.length < 100) throw new Error("縮圖輸出失敗");
        return out;
      }

      function applyParsedCard(parsed,avatarDataUrl = "",avatarProvided = false) {
        elements.characterNameInput.value = parsed.name || "";
        elements.characterDescriptionInput.value = parsed.description || "";
        settings.characterName = elements.characterNameInput.value;
        settings.characterDescription = elements.characterDescriptionInput.value;
        if (avatarProvided) settings.avatarDataUrl = String(avatarDataUrl || "");
        persistSettings();
        return { kind: "card", name: settings.characterName, description: settings.characterDescription, avatarStored: Boolean(settings.avatarDataUrl) };
      }

      function importMemoryPackage(raw) {
        const rows = Array.isArray(raw.chat) ? raw.chat : [];
        chatHistory = rows.filter(row => row && (row.who === "you" || row.who === "him")).slice(-CHAT_CAP).map(row => ({ who: row.who, text: String(row.text || ""), d: String(row.d || localDay()) }));
        const games = Array.isArray(raw.games) ? raw.games.slice(-30) : [];
        safeSet(GAMES_KEY,JSON.stringify(games));
        records = blankRecords();
        for (const key of Object.keys(records)) if (Number.isInteger(raw?.records?.[key]) && raw.records[key] >= 0) records[key] = raw.records[key];
        safeSet(RECORD_KEY,JSON.stringify(records));
        saveChat();
        return { kind: "memory", chatCount: chatHistory.length, gameCount: games.length };
      }

      function importJsonPayload(raw) {
        if (raw?.type === "echecs_memory_v1") return importMemoryPackage(raw);
        if (raw?.type === "echecs_card_v1") return applyParsedCard({ name: String(raw.name || ""), description: String(raw.description || "") },String(raw.avatarDataUrl || ""),true);
        return applyParsedCard(normalizeCharacterCard(raw));
      }

      async function parseCardFile(file) {
        const lower = String(file.name || "").toLowerCase(); let parsed, avatar = "";
        if (lower.endsWith(".png") || file.type === "image/png") { const bytes = await readFileBytes(file); parsed = normalizeCharacterCard(parseTavernPngBytes(bytes)); avatar = await resizeAvatar(file); return applyParsedCard(parsed,avatar,true); }
        if (lower.endsWith(".json") || file.type === "application/json") return importJsonPayload(JSON.parse(await readFileText(file)));
        if (lower.endsWith(".md") || lower.endsWith(".txt") || file.type.startsWith("text/")) parsed = { name: "", description: await readFileText(file) };
        else throw new Error("不支援的檔案格式");
        return applyParsedCard(parsed);
      }

      function downloadJson(payload,filename) {
        const blob = new Blob([JSON.stringify(payload,null,2)],{ type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob), link = document.createElement("a");
        link.href = url; link.download = filename; document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url),0);
        return filename;
      }

      function cardPackage() { persistSettings(); return { type: "echecs_card_v1", name: settings.characterName, description: settings.characterDescription, avatarDataUrl: settings.avatarDataUrl || "" }; }
      function memoryPackage() { return { type: "echecs_memory_v1", games: readJson(GAMES_KEY,[]).slice(-30), chat: chatHistory.slice(-CHAT_CAP), records: { ...records } }; }
      function exportCard() { const payload = cardPackage(), name = (payload.name.trim() || "角色").replace(/[\\/:*?"<>|]/g,"_"); return downloadJson(payload,name + "_卡.json"); }
      function exportMemory() { const stamp = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0,10).replace(/-/g,""); return downloadJson(memoryPackage(),"Échecs_記憶_" + stamp + ".json"); }

      function clearAllData(skipConfirm = false) {
        if (!skipConfirm && !confirm("清除本站儲存的金鑰、角色卡、頭像、棋局、對話、講評與戰績？")) return false;
        const keys = [];

        keys.forEach(key => localStorage.removeItem(key));
        try { localStorage.removeItem(CHAMBRE_KEY); } catch (_error) {}
        cancelCoachRequest(); settings = defaultSettings(); chatHistory = []; records = blankRecords(); settingsToForm(); renderIdentity(); startNewGame(); elements.cardStatus.textContent = "本站 Échecs 資料已清除。"; elements.avatarStatus.textContent = "頭像已清除。";
        return true;
      }

      function endpointPath(suffix) { return settings.endpoint.trim().replace(/\/+$/,"") + suffix; }
      async function loadModels() {
        persistSettings(); elements.modelStatus.textContent = "正在撈清單…"; elements.modelSelect.hidden = true; elements.modelSelect.replaceChildren();
        if (!settings.endpoint || !settings.apiKey) { elements.modelStatus.textContent = "撈不到，請手填"; return false; }
        const controller = new AbortController(), timer = setTimeout(() => controller.abort(),COACH_TIMEOUT_MS);
        try {
          const response = await fetch(endpointPath("/models"),{ headers: { Authorization: "Bearer " + settings.apiKey }, signal: controller.signal });
          if (!response.ok) throw new Error("bad response");
          const data = await response.json(), rows = Array.isArray(data?.data) ? data.data : Array.isArray(data?.models) ? data.models : [];
          const names = rows.map(row => String(typeof row === "string" ? row : row.id || row.name || "").replace(/^models\//,"")).filter(Boolean);
          if (!names.length) throw new Error("empty");
          const placeholder = document.createElement("option"); placeholder.value = ""; placeholder.textContent = "從清單挑一個模型…"; placeholder.disabled = true; placeholder.selected = true;
          elements.modelSelect.replaceChildren(placeholder,...names.map(name => { const option = document.createElement("option"); option.value = name; option.textContent = name; return option; }));
          elements.modelSelect.hidden = false; elements.modelStatus.textContent = "找到 " + names.length + " 個模型，從下拉挑或手填。";
          return names;
        } catch (_error) { elements.modelStatus.textContent = "撈不到，請手填"; return false; }
        finally { clearTimeout(timer); }
      }

      async function handleImportInput(input) {
        const file = input.files?.[0]; if (!file) return null;
        elements.cardStatus.textContent = "正在辨識匯入檔…";
        try {
          const result = await parseCardFile(file);
          elements.cardStatus.textContent = result.kind === "memory" ? "已還原 " + result.chatCount + " 句對話與 " + result.gameCount + " 局講評。" : "已載入" + (result.name ? "「" + result.name + "」" : "文字角色卡") + "。";

      }

      function sideName(color) {
        return color === "w" ? "白方" : "黑方";
      }

      function squareName(fileIndex, rank) {
        return FILES[fileIndex] + rank;
      }

      function getEndMessage() {
        if (game.in_checkmate()) return sideName(game.turn() === "w" ? "b" : "w") + "獲勝（將死）";
        if (game.in_stalemate()) return "和局（逼和：無合法步可走）";
        if (game.in_threefold_repetition()) return "和局（三次重複局面）";
        if (game.insufficient_material()) return "和局（子力不足）";
        if (game.in_draw()) return "和局（五十回合規則）";
        return "對局結束（和局）";
      }

      function isComputerMode() {
        return modeSelect.value === "computer";
      }

      function isBoardLocked() {
        if (!isComputerMode() || engineFailed) return false;
        return !engineReady || engineThinking || hintThinking || game.turn() === "b";
      }

      function currentMoveNo() {
        return Math.floor(game.history().length / 2) + 1;
      }

      function latestAutomaticCoachMove() {
        return coachTranscript.reduce((latest, entry) => (
          entry.who === "him" && entry.trigger !== "hint" && entry.trigger !== "chat" &&
          Number.isInteger(entry.moveNo) && (latest === null || entry.moveNo > latest) ? entry.moveNo : latest
        ), null);
      }

      function readCoachEnabled() {
        try {
          return localStorage.getItem(COACH_ENABLED_KEY) !== "false";
        } catch (_error) {
          return true;
        }
      }

      function rememberCoachEnabled() {
        try {
          localStorage.setItem(COACH_ENABLED_KEY, String(coachEnabled));
        } catch (_error) {
          // 偏好存不下時仍可繼續下棋。
        }
      }

      function clearSavedGame() {
        try {
          localStorage.removeItem(SAVE_KEY);
        } catch (_error) {
          // 儲存空間不可用時不阻擋新局。
        }
      }

      function saveGame() {
        const state = {
          fen: game.fen(),
          sanHistory: game.history(),
          mode: modeSelect.value,
          difficulty: activeDifficulty,
          coachTranscript,
          evalHistory,
          ts: Date.now()
        };
        try {
          localStorage.setItem(SAVE_KEY, JSON.stringify(state));
        } catch (_error) {
          // 暫存失敗不影響棋局。
        }
      }

      function replayMoves(sanHistory) {
        const replayed = new Chess();
        for (const san of sanHistory) {
          if (typeof san !== "string" || !replayed.move(san)) return null;
        }
        return replayed;
      }

      function restoreSavedGame() {
        let saved;
        try {
          saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
        } catch (_error) {
          return false;
        }
        if (!saved || !Array.isArray(saved.sanHistory)) return false;
        if (!Object.hasOwn(DIFFICULTIES, saved.difficulty)) return false;
        if (saved.mode !== "computer" && saved.mode !== "two-player") return false;

        const replayed = replayMoves(saved.sanHistory);
        if (!replayed || replayed.game_over() || replayed.fen() !== saved.fen) return false;

        game = replayed;
        modeSelect.value = saved.mode;
        difficultySelect.value = saved.difficulty;
        activeDifficulty = saved.difficulty;
        coachTranscript = Array.isArray(saved.coachTranscript)
          ? saved.coachTranscript
              .filter(entry => entry && (entry.who === "him" || entry.who === "her" || entry.who === "sys") && typeof entry.text === "string")
            .map(entry => ({
              who: entry.who,
              text: entry.text,
              kind: typeof entry.kind === "string" ? entry.kind : null,
              moveNo: Number.isInteger(entry.moveNo) ? entry.moveNo : null,
              trigger: typeof entry.trigger === "string" ? entry.trigger : null,
              shownAt: -1e9   // 還原的舊句一律標陳年：泡泡常態只留最後一句（頁面時鐘跨載入失義）
            }))
          : [];
        evalHistory = Array.isArray(saved.evalHistory)
          ? saved.evalHistory.filter(entry => entry && Number.isInteger(entry.moveNo) && Number.isFinite(entry.evalW))
            .map(entry => ({
              moveNo: entry.moveNo,
              san: typeof entry.san === "string" ? entry.san : "",
              evalW: entry.evalW,
              prevEvalW: Number.isFinite(entry.prevEvalW) ? entry.prevEvalW : 0,
              drop: Number.isFinite(entry.drop) ? entry.drop : 0,
              summary: typeof entry.summary === "string" ? entry.summary : ""
            }))
          : [];
        lastCoachMove = latestAutomaticCoachMove();
        return true;
      }

      function updateStatus() {
        const turn = sideName(game.turn());   // 後面的狀態文案還要用它——上一版手滑砍掉炸了整個狀態更新，引以為戒
        turnBadge.textContent = turn;   // 徽章只印「白方/黑方」兩字（業主 08-28：反正大部分都在等我）
        statusElement.className = "";

        if (game.game_over()) {
          statusElement.textContent = getEndMessage();
          statusElement.classList.add("game-over");
        } else if (engineFailed) {
          statusElement.textContent = "引擎沒回手";
          statusElement.classList.add("check");
        } else if (isComputerMode() && engineThinking) {
          statusElement.textContent = "對方思考中…";
        } else if (isComputerMode() && !engineReady) {
          statusElement.textContent = "引擎準備中…";
        } else if (game.in_check()) {
          statusElement.textContent = turn + "回合 · 將軍！";
          statusElement.classList.add("check");
        } else {
          statusElement.textContent = turn + "回合";
        }
      }

      function updateHistory() {
        const moves = game.history();

        historyCount.textContent = String(moves.length);

        if (moves.length === 0) {

          for (let i = 0; i < moves.length; i += 2) {

            const number = document.createElement("span");

            row.append(number, whiteMove, blackMove);
